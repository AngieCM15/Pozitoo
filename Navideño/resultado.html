<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>🎄 Ranking Pozito Navideño 2026</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<script
src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
</script>


<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

:root{

    --rojo:#c62828;
    --rojo-oscuro:#8e1b1b;
    --rojo-claro:#ef5350;

    --verde:#176b3a;
    --verde-oscuro:#0d4726;
    --verde-claro:#2e8b57;

    --dorado:#d4a72c;
    --dorado-claro:#ffe082;

    --crema:#fffaf0;
    --blanco:#ffffff;

    --texto:#26332b;
    --gris:#66736b;

}


/* =====================================================
   BODY
===================================================== */

body{

    min-height:100vh;

    padding:35px 25px;

    color:var(--texto);

    overflow-x:hidden;

    background:

        radial-gradient(
            circle at 5% 5%,
            #ef535033 0%,
            transparent 25%
        ),

        radial-gradient(
            circle at 95% 5%,
            #2e8b5740 0%,
            transparent 27%
        ),

        radial-gradient(
            circle at 5% 95%,
            #ffe08255 0%,
            transparent 25%
        ),

        radial-gradient(
            circle at 95% 95%,
            #c6282833 0%,
            transparent 25%
        ),

        linear-gradient(
            135deg,
            #fffdf7,
            #f5fff8 50%,
            #fff8f8
        );

}


/* =====================================================
   DECORACIONES DEL FONDO
===================================================== */

body::before{

    content:
        "❄️   🎄   ❄️   🎁   ❄️   🔔   ❄️";

    position:fixed;

    top:10px;

    left:15px;

    right:15px;

    text-align:center;

    font-size:25px;

    letter-spacing:7px;

    opacity:.28;

    pointer-events:none;

    z-index:0;

}


body::after{

    content:
        "🎄   ⭐   🎄   🎅   🎄   ⭐   🎄";

    position:fixed;

    bottom:10px;

    left:15px;

    right:15px;

    text-align:center;

    font-size:25px;

    letter-spacing:7px;

    opacity:.22;

    pointer-events:none;

    z-index:0;

}


/* =====================================================
   TITULO PRINCIPAL
===================================================== */

h1{

    position:relative;

    z-index:2;

    text-align:center;

    color:var(--rojo);

    font-size:
        clamp(
            30px,
            5vw,
            56px
        );

    font-weight:900;

    margin-bottom:45px;

    letter-spacing:1px;

    text-shadow:
        0 4px 10px #8e1b1b20;

}


h1::before{

    content:"🎄";

    display:inline-block;

    margin-right:12px;

    animation:
        arbol 2.5s infinite ease-in-out;

}


h1::after{

    content:"🎄";

    display:inline-block;

    margin-left:12px;

    animation:
        arbol 2.5s infinite ease-in-out reverse;

}


@keyframes arbol{

    0%,100%{

        transform:
            translateY(0)
            rotate(-3deg)
            scale(1);

    }

    50%{

        transform:
            translateY(-7px)
            rotate(3deg)
            scale(1.06);

    }

}


/* =====================================================
   MENSAJE SIN PARTICIPANTES
===================================================== */

.sinResultados{

    position:relative;

    z-index:2;

    max-width:700px;

    margin:80px auto;

    padding:45px;

    background:
        rgba(255,255,255,.94);

    border:
        2px solid #d8b44a55;

    border-radius:28px;

    text-align:center;

    box-shadow:
        0 20px 50px #8e1b1b18;

}


.sinResultados h2{

    font-size:30px;

    margin-bottom:15px;

    color:var(--rojo);

}


.sinResultados p{

    font-size:18px;

    color:var(--gris);

}


/* =====================================================
   GALERIA
===================================================== */

.galeria{

    position:relative;

    z-index:2;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:24px;

    width:100%;

    max-width:1500px;

    margin:auto;

}


/* =====================================================
   TARJETAS
===================================================== */

.tarjeta{

    position:relative;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #fffdf7
        );

    padding:13px;

    border-radius:24px;

    cursor:pointer;

    overflow:hidden;

    border:
        2px solid #d4a72c44;

    box-shadow:
        0 12px 30px #173d2815;

    transition:
        transform .3s,
        box-shadow .3s,
        border-color .3s;

}


.tarjeta::before{

    content:"❄️";

    position:absolute;

    top:-12px;

    right:3px;

    font-size:48px;

    opacity:.14;

}


.tarjeta::after{

    content:"🎄";

    position:absolute;

    bottom:-15px;

    left:-4px;

    font-size:46px;

    opacity:.12;

}


.tarjeta:hover{

    transform:
        translateY(-7px);

    box-shadow:
        0 20px 40px #173d2825;

    border-color:
        #d4a72caa;

}


.tarjeta h2{

    position:relative;

    z-index:2;

    text-align:center;

    color:var(--verde-oscuro);

    font-size:19px;

    font-weight:800;

    margin:
        7px 0 13px;

}


.tarjeta h2::before{

    content:"🎄 ";

}


.tarjeta h2::after{

    content:" 🎄";

}


/* =====================================================
   MINIATURA
===================================================== */

.miniatura{

    width:100%;

    display:block;

    border-radius:17px;

    box-shadow:
        0 7px 18px #0002;

    transition:.3s;

}


.tarjeta:hover .miniatura{

    transform:
        scale(1.01);

}


/* =====================================================
   VISOR
===================================================== */

.visor{

    position:fixed;

    inset:0;

    background:
        rgba(10,35,22,.84);

    backdrop-filter:
        blur(12px);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:100;

    padding:20px;

}


.visor.activo{

    display:flex;

    animation:
        aparecer .25s ease;

}


@keyframes aparecer{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}


/* =====================================================
   CAJA VISOR
===================================================== */

.visorCaja{

    position:relative;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #fffaf0
        );

    padding:17px;

    border-radius:26px;

    max-width:94vw;

    max-height:94vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    box-shadow:
        0 30px 80px #0008;

}


#imagenGrande{

    max-width:88vw;

    max-height:78vh;

    border-radius:17px;

    display:block;

    box-shadow:
        0 15px 40px #0006;

}


/* =====================================================
   BOTON CERRAR
===================================================== */

.cerrar{

    position:absolute;

    right:10px;

    top:10px;

    width:45px;

    height:45px;

    border:none;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            var(--rojo),
            var(--rojo-oscuro)
        );

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    z-index:5;

    box-shadow:
        0 5px 15px #0004;

    transition:.25s;

}


.cerrar:hover{

    transform:
        rotate(90deg)
        scale(1.08);

}


/* =====================================================
   BOTON DESCARGAR
===================================================== */

.descargar{

    margin-top:16px;

    padding:13px 32px;

    border:none;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            var(--verde),
            var(--verde-oscuro)
        );

    color:white;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 7px 18px #176b3a44;

    transition:.3s;

}


.descargar:hover{

    transform:
        translateY(-3px);

    box-shadow:
        0 10px 24px #176b3a55;

}


/* =====================================================
   ZONA OCULTA
===================================================== */

#zonaImagenes{

    position:absolute;

    left:-99999px;

    top:0;

}


/* =====================================================
   PLANTILLA DE IMAGEN
===================================================== */

.paginaImagen{

    width:1080px;

    min-height:1350px;

    padding:55px;

    position:relative;

    overflow:hidden;

    color:var(--texto);

    border-radius:35px;

    background:

        radial-gradient(
            circle at 8% 5%,
            #ef535025,
            transparent 25%
        ),

        radial-gradient(
            circle at 92% 7%,
            #2e8b5730,
            transparent 27%
        ),

        radial-gradient(
            circle at 5% 95%,
            #ffe08255,
            transparent 27%
        ),

        radial-gradient(
            circle at 95% 95%,
            #c6282825,
            transparent 28%
        ),

        linear-gradient(
            145deg,
            #fffdf8,
            #ffffff 50%,
            #f6fff9
        );

    box-shadow:
        0 30px 70px #0004;

}


/* =====================================================
   DECORACIONES IMAGEN
===================================================== */

.paginaImagen::before{

    content:
        "❄️   🎄   ⭐   🎁   🔔   🎄   ❄️";

    position:absolute;

    top:20px;

    left:0;

    right:0;

    text-align:center;

    font-size:34px;

    letter-spacing:6px;

    opacity:.45;

}


.paginaImagen::after{

    content:
        "🎄   ❄️   🎁   ⭐   🎄   ❄️   🎄";

    position:absolute;

    bottom:20px;

    left:0;

    right:0;

    text-align:center;

    font-size:32px;

    letter-spacing:6px;

    opacity:.30;

}


/* =====================================================
   TITULO DE LA IMAGEN
===================================================== */

.tituloRanking{

    position:relative;

    z-index:2;

    text-align:center;

    font-size:56px;

    font-weight:900;

    color:var(--rojo);

    letter-spacing:1px;

    margin-bottom:34px;

    padding-top:30px;

    text-shadow:
        0 4px 10px #8e1b1b18;

}


.tituloRanking::before{

    content:"🎄";

    display:block;

    font-size:76px;

    line-height:1;

    margin-bottom:8px;

}


.tituloRanking span{

    display:inline-block;

    margin-top:10px;

    padding:
        8px 26px;

    border-radius:25px;

    color:var(--verde-oscuro);

    font-size:26px;

    font-weight:700;

    background:
        linear-gradient(
            135deg,
            #eaf7ef,
            #fff8dc
        );

    border:
        2px solid #d4a72c77;

    box-shadow:
        0 6px 18px #173d2815;

}


/* =====================================================
   LISTA
===================================================== */

.listaRanking{

    position:relative;

    z-index:2;

}


/* =====================================================
   FILAS
===================================================== */

.filaRanking{

    position:relative;

    display:flex;

    justify-content:space-between;

    align-items:center;

    min-height:75px;

    padding:
        13px 22px;

    margin-bottom:12px;

    border-radius:18px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #fffdf7
        );

    color:#334139;

    font-size:26px;

    font-weight:700;

    box-shadow:
        0 6px 17px #173d2818;

    border:
        2px solid #d4a72c33;

    transition:.2s;

}


/* =====================================================
   INFORMACION JUGADOR
===================================================== */

.filaRanking div{

    display:flex;

    align-items:center;

    gap:12px;

    min-width:0;

}


.filaRanking b{

    color:var(--verde);

    font-size:23px;

    min-width:65px;

}


.filaRanking .nombreJugador{

    color:#26332b;

    font-size:26px;

    font-weight:800;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

}


/* =====================================================
   PUNTOS
===================================================== */

.filaRanking strong{

    display:flex;

    align-items:center;

    justify-content:center;

    min-width:150px;

    padding:
        8px 18px;

    border-radius:14px;

    color:#684f00;

    font-size:26px;

    font-weight:900;

    white-space:nowrap;

    background:
        linear-gradient(
            135deg,
            #fff3b0,
            #ffe082
        );

    border:
        2px solid #d4a72c88;

    box-shadow:
        0 4px 10px #d4a72c22;

}


/* =====================================================
   PRIMEROS 3
   SIN HACER QUE EL PRIMERO SEA
   DEMASIADO GRANDE
===================================================== */

.oro,
.plata,
.bronce{

    min-height:78px;

}


.oro strong,
.plata strong,
.bronce strong{

    font-size:26px;

}


/* =====================================================
   ORO
===================================================== */

.oro{

    background:
        linear-gradient(
            90deg,
            #fff8d7,
            #fff3b0
        );

    border-color:#e0b52f;

}


.oro b{

    color:#8a6700;

}


.oro strong{

    color:#684f00;

}


/* =====================================================
   PLATA
===================================================== */

.plata{

    background:
        linear-gradient(
            90deg,
            #f7f8f8,
            #e9eeee
        );

    border-color:#b8c1c3;

}


.plata b{

    color:#596467;

}


.plata strong{

    background:
        linear-gradient(
            135deg,
            #f1f3f3,
            #dfe4e5
        );

    border-color:#aeb8ba;

    color:#4f5a5d;

}


/* =====================================================
   BRONCE
===================================================== */

.bronce{

    background:
        linear-gradient(
            90deg,
            #fff0df,
            #f2d0b0
        );

    border-color:#d2935c;

}


.bronce b{

    color:#814c27;

}


.bronce strong{

    background:
        linear-gradient(
            135deg,
            #f5d4b5,
            #e6b383
        );

    border-color:#c98650;

    color:#70421f;

}


/* =====================================================
   RESTO DEL RANKING
===================================================== */

.filaRanking:nth-child(n+4){

    min-height:68px;

    padding:
        11px 20px;

    font-size:24px;

}


.filaRanking:nth-child(n+4) strong{

    font-size:24px;

}


/* =====================================================
   PUESTO
===================================================== */

.filaRanking:nth-child(n+4) b{

    color:#53705e;

}


/* =====================================================
   SEPARADOR
===================================================== */

.listaRanking::after{

    content:
        "❄️   ✦   🎄   ✦   ⭐   ✦   🎄";

    display:block;

    text-align:center;

    font-size:25px;

    color:var(--rojo);

    margin-top:25px;

    opacity:.7;

}


/* =====================================================
   PIE DE IMAGEN
===================================================== */

.finalRanking{

    position:absolute;

    z-index:2;

    bottom:32px;

    left:55px;

    right:55px;

    padding-top:17px;

    border-top:
        2px solid #d4a72c55;

    text-align:center;

    font-size:20px;

    color:var(--verde);

    font-weight:700;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1250px){

    .galeria{

        grid-template-columns:
            repeat(3,1fr);

    }

}


@media(max-width:900px){

    body{

        padding:
            25px 15px;

    }


    h1{

        font-size:32px;

        margin-bottom:30px;

    }


    .galeria{

        grid-template-columns:
            repeat(2,1fr);

        gap:18px;

    }


    .tarjeta{

        border-radius:20px;

        padding:10px;

    }

}


@media(max-width:600px){

    body{

        padding:
            20px 10px;

    }


    h1{

        font-size:25px;

        line-height:1.3;

    }


    h1::before,
    h1::after{

        margin:
            0 3px;

    }


    .galeria{

        grid-template-columns:1fr;

        max-width:450px;

    }


    .visor{

        padding:10px;

    }


    .visorCaja{

        padding:9px;

        border-radius:18px;

    }


    #imagenGrande{

        max-width:92vw;

        max-height:78vh;

    }


    .cerrar{

        width:40px;

        height:40px;

    }

}


/* =====================================================
   ANIMACION TARJETAS
===================================================== */

.tarjeta{

    animation:
        tarjetaEntrada .5s ease backwards;

}


.tarjeta:nth-child(2){
    animation-delay:.08s;
}

.tarjeta:nth-child(3){
    animation-delay:.16s;
}

.tarjeta:nth-child(4){
    animation-delay:.24s;
}

.tarjeta:nth-child(5){
    animation-delay:.32s;
}

.tarjeta:nth-child(6){
    animation-delay:.40s;
}


@keyframes tarjetaEntrada{

    from{

        opacity:0;

        transform:
            translateY(20px)
            scale(.98);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =====================================================
   REDUCIR ANIMACIONES
===================================================== */

@media(prefers-reduced-motion:reduce){

    *{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        transition-duration:.01ms !important;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     TITULO
===================================================== -->

<h1>
    RANKING POZITO NAVIDEÑO 2026
</h1>


<!-- =====================================================
     GALERIA
===================================================== -->

<div
    class="galeria"
    id="galeria">
</div>


<!-- =====================================================
     VISOR GRANDE
===================================================== -->

<div
    class="visor"
    id="visor">

    <div class="visorCaja">


        <button
            class="cerrar"
            onclick="cerrarImagen()">

            ✖

        </button>


        <img
            id="imagenGrande"
            alt="Ranking Pozito Navideño">


        <button
            class="descargar"
            onclick="descargarImagen()">

            ⬇ Descargar imagen

        </button>


    </div>

</div>


<!-- =====================================================
     ZONA OCULTA
===================================================== -->

<div
    id="zonaImagenes">
</div>


<script>


// =====================================================
// CLAVE NUEVA
// INDEPENDIENTE DEL POZITO PRIMAVERAL
// =====================================================

const KEY_JUGADORES =
    "POZITO_NAVIDENO_2026_JUGADORES_V1";


// =====================================================
// CARGAR JUGADORES
// =====================================================

let jugadores = [];


try{

    jugadores =
        JSON.parse(
            localStorage.getItem(
                KEY_JUGADORES
            )
        ) || [];

}
catch(error){

    console.error(
        "Error leyendo jugadores:",
        error
    );

    jugadores = [];

}


// =====================================================
// CALCULAR TOTAL
// =====================================================

function calcularTotal(jugador){

    let total = 0;


    if(!jugador.puntos){

        return 0;

    }


    for(
        let fecha in jugador.puntos
    ){

        total +=
            Number(
                jugador.puntos[fecha]
            ) || 0;

    }


    return total;

}


// =====================================================
// PREPARAR TOTALES
// =====================================================

jugadores.forEach(
    jugador => {

        jugador.total =
            calcularTotal(
                jugador
            );

    }
);


// =====================================================
// ORDENAR RANKING
// =====================================================

jugadores.sort(
    (a,b) => {

        return (
            b.total -
            a.total
        );

    }
);


// =====================================================
// ELEMENTOS
// =====================================================

const galeria =
    document.getElementById(
        "galeria"
    );


const zona =
    document.getElementById(
        "zonaImagenes"
    );


let imagenActual = "";


// =====================================================
// SI NO HAY JUGADORES
// =====================================================

if(
    jugadores.length === 0
){

    galeria.innerHTML = `

        <div class="sinResultados">

            <h2>
                🎄 NO HAY PARTICIPANTES 🎄
            </h2>

            <p>
                Todavía no hay jugadores registrados
                en el Pozito Navideño 2026.
            </p>

        </div>

    `;

}
else{

    crearPaginas();

}


// =====================================================
// CREAR PAGINAS
// =====================================================

function crearPaginas(){

    let paginas = [];


    // =================================================
    // PRIMERA PAGINA
    // TOP 10
    // =================================================

    if(
        jugadores.length > 0
    ){

        paginas.push({

            titulo:
                "TOP 10",

            datos:
                jugadores.slice(
                    0,
                    10
                )

        });

    }


    // =================================================
    // SIGUIENTES PAGINAS
    // =================================================

    for(
        let i = 10;

        i < jugadores.length;

        i += 20
    ){

        paginas.push({

            titulo:
                `PUESTOS ${
                    i + 1
                } - ${
                    Math.min(
                        i + 20,
                        jugadores.length
                    )
                }`,

            datos:
                jugadores.slice(
                    i,
                    i + 20
                )

        });

    }


    // =================================================
    // GENERAR IMAGENES
    // =================================================

    paginas.forEach(
        (pagina,index) => {

            crearImagenRanking(
                pagina,
                index
            );

        }
    );

}


// =====================================================
// CREAR IMAGEN DEL RANKING
// =====================================================

function crearImagenRanking(
    pagina,
    index
){

    let div =
        document.createElement(
            "div"
        );


    div.className =
        "paginaImagen";


    div.innerHTML = `

        <div class="tituloRanking">

            RANKING POZITO NAVIDEÑO

            <br>

            <span>
                ${pagina.titulo}
            </span>

        </div>


        <div class="listaRanking">
        </div>


        <div class="finalRanking">

            🎄 POZITO NAVIDEÑO 2026

            &nbsp; • &nbsp;

            🎅 04 DE OCTUBRE AL 22 DE DICIEMBRE 🎅

        </div>

    `;


    let lista =
        div.querySelector(
            ".listaRanking"
        );


    // =================================================
    // CREAR FILAS
    // =================================================

    pagina.datos.forEach(
        (j,i) => {

            let puesto;


            // -----------------------------------------
            // TOP 10
            // -----------------------------------------

            if(
                index === 0
            ){

                puesto =
                    i + 1;

            }


            // -----------------------------------------
            // SIGUIENTES PAGINAS
            // -----------------------------------------

            else{

                puesto =
                    11 +
                    (index - 1) * 20 +
                    i;

            }


            // -----------------------------------------
            // ICONOS
            // -----------------------------------------

            let icono =
                "🎄";


            if(
                puesto === 1
            ){

                icono =
                    "🥇";

            }


            if(
                puesto === 2
            ){

                icono =
                    "🥈";

            }


            if(
                puesto === 3
            ){

                icono =
                    "🥉";

            }


            // -----------------------------------------
            // FILA
            // -----------------------------------------

            let fila =
                document.createElement(
                    "div"
                );


            fila.className =
                "filaRanking";


            if(
                puesto === 1
            ){

                fila.classList.add(
                    "oro"
                );

            }


            if(
                puesto === 2
            ){

                fila.classList.add(
                    "plata"
                );

            }


            if(
                puesto === 3
            ){

                fila.classList.add(
                    "bronce"
                );

            }


            fila.innerHTML = `

                <div>

                    <span>
                        ${icono}
                    </span>

                    <b>
                        #${puesto}
                    </b>

                    <span class="nombreJugador">
                        ${j.nombre}
                    </span>

                </div>


                <strong>
                    ⭐ ${j.total} PUNTOS
                </strong>

            `;


            lista.appendChild(
                fila
            );

        }
    );


    // =================================================
    // AGREGAR A ZONA OCULTA
    // =================================================

    zona.appendChild(
        div
    );


    // =================================================
    // GENERAR PNG
    // =================================================

    setTimeout(
        () => {

            html2canvas(
                div,
                {

                    scale:2,

                    backgroundColor:null,

                    useCORS:true,

                    logging:false

                }

            )
            .then(
                canvas => {

                    let imagen =
                        canvas.toDataURL(
                            "image/png"
                        );


                    crearTarjeta(
                        pagina.titulo,
                        imagen,
                        index
                    );

                }
            )
            .catch(
                error => {

                    console.error(
                        "Error creando imagen:",
                        error
                    );

                }
            );


        },
        300
    );

}


// =====================================================
// CREAR TARJETA DE GALERIA
// =====================================================

function crearTarjeta(
    titulo,
    imagen,
    index
){

    let tarjeta =
        document.createElement(
            "div"
        );


    tarjeta.className =
        "tarjeta";


    tarjeta.innerHTML = `

        <h2>
            ${titulo}
        </h2>


        <img
            class="miniatura"
            src="${imagen}"
            alt="${titulo}"
        >

    `;


    tarjeta.onclick =
        function(){

            abrirImagen(
                imagen
            );

        };


    galeria.appendChild(
        tarjeta
    );

}


// =====================================================
// ABRIR IMAGEN
// =====================================================

function abrirImagen(
    imagen
){

    imagenActual =
        imagen;


    document
        .getElementById(
            "imagenGrande"
        )
        .src =
        imagen;


    document
        .getElementById(
            "visor"
        )
        .classList.add(
            "activo"
        );

}


// =====================================================
// CERRAR IMAGEN
// =====================================================

function cerrarImagen(){

    document
        .getElementById(
            "visor"
        )
        .classList.remove(
            "activo"
        );

}


// =====================================================
// DESCARGAR
// =====================================================

function descargarImagen(){

    if(!imagenActual){

        return;

    }


    let enlace =
        document.createElement(
            "a"
        );


    enlace.href =
        imagenActual;


    enlace.download =
        "Ranking_Pozito_Navideno_2026.png";


    enlace.click();

}


// =====================================================
// CERRAR CON ESC
// =====================================================

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            cerrarImagen();

        }

    }
);

</script>
