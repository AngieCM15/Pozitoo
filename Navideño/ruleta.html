<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>🎄 Ruleta Pozito Navideño 2026</title>

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;

    width:100%;

    height:100%;

    overflow:hidden;

    font-family:
        Arial,
        sans-serif;

}

body{

    color:white;

    background:

        radial-gradient(
            circle at 50% -10%,
            #24452d,
            transparent 45%
        ),

        radial-gradient(
            circle at 10% 90%,
            #8b1e2d,
            transparent 35%
        ),

        radial-gradient(
            circle at 90% 90%,
            #b8860b,
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #07150c,
            #0b2414 45%,
            #12080b
        );

}


/* =====================================================
   ESCENA
===================================================== */

.scene{

    position:relative;

    width:100vw;

    height:100vh;

    overflow:hidden;

}


/* =====================================================
   DECORACIÓN NAVIDEÑA
===================================================== */

.scene::before{

    content:
        "🎄  ❄️  🎅  ⭐  🎁  ❄️  🦌  🎄";

    position:absolute;

    top:12px;

    left:0;

    right:0;

    text-align:center;

    font-size:28px;

    letter-spacing:5px;

    opacity:.35;

    pointer-events:none;

    z-index:1;

}


.scene::after{

    content:
        "🎁  ⭐  ❄️  🎄  🔔  🎄  ❄️  ⭐";

    position:absolute;

    bottom:10px;

    left:0;

    right:0;

    text-align:center;

    font-size:25px;

    letter-spacing:5px;

    opacity:.3;

    pointer-events:none;

    z-index:1;

}


/* =====================================================
   TÍTULO
===================================================== */

.titulo{

    position:absolute;

    top:18px;

    left:50%;

    transform:
        translateX(-50%);

    z-index:100;

    text-align:center;

    white-space:nowrap;

}


.titulo h1{

    margin:0;

    color:#ffe082;

    font-size:clamp(
        22px,
        4vw,
        42px
    );

    font-weight:900;

    text-shadow:

        0 0 10px #ffd54f,

        0 0 25px #ff9800,

        0 4px 10px #0008;

}


.titulo p{

    margin:5px 0 0;

    color:#fff;

    font-size:14px;

    font-weight:bold;

    opacity:.9;

}


/* =====================================================
   PELOTITAS
===================================================== */

.ball{

    position:absolute;

    width:120px;

    height:120px;

    border-radius:50%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:10px;

    color:#111;

    font-weight:900;

    user-select:none;

    word-break:break-word;

    border:

        4px solid rgba(
            255,
            255,
            255,
            .7
        );

    box-shadow:

        inset 0 0 20px #fff,

        inset -10px -12px 20px #0003,

        0 7px 20px #0008,

        0 0 20px #ffffff33;

    transition:

        opacity .3s,

        transform .3s,

        box-shadow .3s;

    z-index:5;

}


.ball .nombre{

    font-size:14px;

    line-height:1.1;

    max-width:100px;

}


.ball .puntos{

    margin-top:5px;

    padding:3px 8px;

    border-radius:10px;

    background:#00000022;

    font-size:13px;

    font-weight:900;

}


/* =====================================================
   GANADOR
===================================================== */

.win{

    transform:
        scale(1.8)!important;

    z-index:999!important;

    border-color:#fff;

    box-shadow:

        0 0 25px #fff,

        0 0 60px #ffd700,

        0 0 120px #ff9800,

        inset 0 0 25px #fff!important;

    animation:

        ganadorBrillo .6s infinite alternate;

}


@keyframes ganadorBrillo{

    from{

        filter:brightness(1);

    }

    to{

        filter:brightness(1.5);

    }

}


/* =====================================================
   TEXTO SUPERIOR DEL GANADOR
===================================================== */

#ganador{

    position:absolute;

    top:85px;

    left:50%;

    transform:
        translateX(-50%);

    z-index:1000;

    color:#ffe082;

    font-size:25px;

    font-weight:900;

    text-align:center;

    text-shadow:

        0 0 12px #ffd700,

        0 3px 8px #000;

}


/* =====================================================
   INFORMACIÓN PARTICIPANTES
===================================================== */

.infoRuleta{

    position:absolute;

    top:125px;

    left:50%;

    transform:
        translateX(-50%);

    z-index:100;

    padding:8px 18px;

    border-radius:20px;

    background:#0008;

    border:

        1px solid #ffd54f66;

    color:#fff;

    font-size:14px;

    font-weight:bold;

    backdrop-filter:blur(5px);

}


/* =====================================================
   CONTROLES
===================================================== */

.controls{

    position:absolute;

    bottom:25px;

    left:50%;

    transform:
        translateX(-50%);

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    justify-content:center;

    width:95%;

    z-index:2000;

}


button{

    border:none;

    border-radius:14px;

    padding:12px 18px;

    color:white;

    font-size:15px;

    font-weight:900;

    cursor:pointer;

    box-shadow:

        0 6px 18px #0008;

    transition:.25s;

}


button:hover{

    transform:
        translateY(-3px)
        scale(1.03);

}


button:active{

    transform:
        scale(.96);

}


#start{

    background:
        linear-gradient(
            135deg,
            #15803d,
            #22c55e
        );

}


#stop{

    background:
        linear-gradient(
            135deg,
            #991b1b,
            #ef4444
        );

}


#conteo{

    background:
        linear-gradient(
            135deg,
            #1d4ed8,
            #3b82f6
        );

}


#detenerConteo{

    background:
        linear-gradient(
            135deg,
            #6b21a8,
            #a855f7
        );

}


#historial{

    background:
        linear-gradient(
            135deg,
            #92400e,
            #f59e0b
        );

}


#recargar{

    background:
        linear-gradient(
            135deg,
            #374151,
            #6b7280
        );

}


/* =====================================================
   MODAL GANADOR
===================================================== */

.modal{

    display:none;

    position:absolute;

    top:50%;

    left:50%;

    transform:
        translate(-50%,-50%);

    width:390px;

    max-width:92vw;

    padding:32px;

    border-radius:28px;

    background:

        linear-gradient(
            145deg,
            #ffffff,
            #fff8e1
        );

    color:#222;

    text-align:center;

    z-index:5000;

    box-shadow:

        0 0 30px #ffd700,

        0 0 80px #ff9800,

        0 25px 70px #000b;

}


.modal h1{

    margin:0;

    color:#b91c1c;

    font-size:30px;

}


.modal h2{

    margin:20px 0 10px;

    color:#166534;

    font-size:30px;

    word-break:break-word;

}


.puntosGanador{

    display:inline-block;

    padding:8px 18px;

    border-radius:20px;

    background:#fff3cd;

    color:#92400e;

    font-size:20px;

    font-weight:900;

}


.cerrar{

    position:absolute;

    right:12px;

    top:10px;

    cursor:pointer;

    font-size:22px;

}


/* =====================================================
   CONTEO
===================================================== */

#mensajeConteo{

    margin-top:20px;

    color:#1d4ed8;

    font-size:19px;

    font-weight:900;

    line-height:1.5;

}


.numero{

    margin:15px;

    color:#dc2626;

    font-size:65px;

    font-weight:900;

    text-shadow:

        0 4px 10px #0003;

}


/* =====================================================
   HISTORIAL
===================================================== */

.historialModal{

    display:none;

    position:absolute;

    top:50%;

    left:50%;

    transform:
        translate(-50%,-50%);

    width:520px;

    max-width:92vw;

    max-height:82vh;

    padding:30px;

    border-radius:28px;

    background:

        linear-gradient(
            145deg,
            #ffffff,
            #fff8e1
        );

    color:#222;

    z-index:6000;

    box-shadow:

        0 0 45px #ffd700,

        0 25px 70px #000b;

}


.historialModal h1{

    margin:0 0 20px;

    text-align:center;

    color:#b45309;

    font-size:25px;

}


.listaHistorial{

    max-height:55vh;

    overflow-y:auto;

}


.itemHistorial{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:10px;

    padding:14px 16px;

    border-radius:16px;

    background:

        linear-gradient(
            135deg,
            #fff,
            #fef3c7
        );

    box-shadow:

        0 4px 12px #0002;

}


.numeroGanador{

    color:#b45309;

    font-size:17px;

    font-weight:900;

}


.nombreGanador{

    color:#166534;

    text-align:right;

    font-weight:900;

}


.nombreGanador small{

    color:#777;

    font-weight:normal;

}


.sinGanadores{

    padding:30px;

    text-align:center;

    color:#777;

    font-weight:bold;

}


.cerrarHistorial{

    display:block;

    margin:20px auto 0;

    background:

        linear-gradient(
            135deg,
            #991b1b,
            #dc2626
        );

}


/* =====================================================
   MENSAJE SIN PARTICIPANTES
===================================================== */

.sinParticipantes{

    position:absolute;

    top:50%;

    left:50%;

    transform:
        translate(-50%,-50%);

    width:90%;

    max-width:600px;

    padding:35px;

    border-radius:25px;

    background:#000b;

    border:

        2px solid #ffd54f;

    text-align:center;

    z-index:100;

}


.sinParticipantes h2{

    color:#ffe082;

    margin:0 0 15px;

}


.sinParticipantes p{

    margin:0;

    line-height:1.6;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:700px){

    .ball{

        width:85px;

        height:85px;

    }


    .ball .nombre{

        font-size:10px;

        max-width:70px;

    }


    .ball .puntos{

        font-size:9px;

        padding:2px 5px;

    }


    .titulo{

        top:10px;

    }


    .titulo h1{

        font-size:22px;

    }


    .titulo p{

        font-size:11px;

    }


    #ganador{

        top:70px;

        font-size:18px;

    }


    .infoRuleta{

        top:100px;

        font-size:11px;

    }


    .controls{

        bottom:10px;

    }


    .controls button{

        padding:9px 11px;

        font-size:12px;

    }


    .modal{

        padding:25px 20px;

    }


    .itemHistorial{

        flex-direction:column;

        text-align:center;

    }


    .nombreGanador{

        text-align:center;

    }

}

</style>

</head>


<body>


<div
class="scene"
id="scene">


    <div class="titulo">

        <h1>
            🎄 RULETA POZITO NAVIDEÑO 2026 🎄
        </h1>

        <p>
            🎅 PUESTOS 11 EN ADELANTE • MÍNIMO 20 PUNTOS
        </p>

    </div>


    <div
        id="ganador">
    </div>


    <div
        class="infoRuleta"
        id="infoRuleta">
    </div>


</div>


<!-- =====================================================
     CONTROLES
===================================================== -->

<div class="controls">

    <button
        id="start"
        onclick="iniciar()">

        🎡 GIRAR

    </button>


    <button
        id="stop"
        onclick="detener()">

        🛑 DETENER

    </button>


    <button
        id="conteo"
        onclick="iniciarConteo()">

        ⏳ CONTEO

    </button>


    <button
        id="detenerConteo"
        onclick="pararConteo()">

        ✋ DETENER CONTEO

    </button>


    <button
        id="historial"
        onclick="mostrarHistorial()">

        📜 HISTORIAL

    </button>


    <button
        id="recargar"
        onclick="recargarParticipantes()">

        🔄 ACTUALIZAR

    </button>

</div>


<!-- =====================================================
     MODAL GANADOR
===================================================== -->

<div
class="modal"
id="modal">


    <div
        class="cerrar"
        onclick="cerrarModal()">

        ❌

    </div>


    <h1>

        🎉 ¡GANADOR! 🎉

    </h1>


    <h2
        id="nombreGanador">
    </h2>


    <div
        class="puntosGanador"
        id="puntosGanador">
    </div>


    <div
        id="mensajeConteo">
    </div>


    <div
        class="numero"
        id="numero">
    </div>


</div>


<!-- =====================================================
     HISTORIAL
===================================================== -->

<div
class="historialModal"
id="historialModal">


    <div
        class="cerrar"
        onclick="cerrarHistorial()">

        ❌

    </div>


    <h1>

        🎄📜 HISTORIAL DE GANADORES

    </h1>


    <div
        class="listaHistorial"
        id="listaHistorial">
    </div>


    <button
        class="cerrarHistorial"
        onclick="cerrarHistorial()">

        Cerrar

    </button>


</div>


<script>


/* =====================================================
   MISMAS CLAVES DEL SISTEMA PRINCIPAL
===================================================== */

const KEY_JUGADORES =
    "POZITO_NAVIDENO_2026_JUGADORES_V1";


const KEY_RULETA =
    "POZITO_NAVIDENO_2026_RULETA_V1";


const KEY_HISTORIAL =
    "POZITO_NAVIDENO_2026_HISTORIAL_V1";


/* =====================================================
   CARGAR JUGADORES
===================================================== */

let todos = [];

let jugadores = [];

let historial = [];


function cargarDatos(){

    try{

        todos =
            JSON.parse(
                localStorage.getItem(
                    KEY_JUGADORES
                )
            ) || [];

    }
    catch(error){

        todos = [];

    }


    try{

        historial =
            JSON.parse(
                localStorage.getItem(
                    KEY_HISTORIAL
                )
            ) || [];

    }
    catch(error){

        historial = [];

    }


    /* =============================================
       ASEGURAR ESTRUCTURA
    ============================================= */

    todos =
        todos.filter(
            jugador =>
                jugador &&
                jugador.nombre
        );


    todos.forEach(
        jugador => {

            if(
                !jugador.puntos ||
                typeof jugador.puntos !== "object"
            ){

                jugador.puntos = {};

            }

            jugador.total =
                calcularTotal(
                    jugador
                );

        }
    );


    /* =============================================
       ORDENAR POR PUNTOS
    ============================================= */

    todos.sort(
        (a,b) =>
            b.total - a.total
    );


    /* =============================================
       IMPORTANTE:
       PUESTOS 1 AL 10 NO PARTICIPAN

       DESDE EL PUESTO 11 SÍ
       PERO SOLO CON 20+ PUNTOS
    ============================================= */

    jugadores =
        todos
            .slice(10)
            .filter(
                jugador =>
                    jugador.total >= 20
            );


    /* =============================================
       GUARDAR COPIA DE RULETA
    ============================================= */

    localStorage.setItem(

        KEY_RULETA,

        JSON.stringify(
            jugadores
        )

    );


    actualizarInfo();

}


/* =====================================================
   CALCULAR TOTAL
===================================================== */

function calcularTotal(jugador){

    let total = 0;


    if(
        !jugador ||
        !jugador.puntos
    ){

        return 0;

    }


    for(
        let fecha in jugador.puntos
    ){

        total +=
            Number(
                jugador.puntos[fecha]
            ) || 0;

    }


    return total;

}


/* =====================================================
   INFORMACIÓN
===================================================== */

function actualizarInfo(){

    let info =
        document.getElementById(
            "infoRuleta"
        );


    if(!info)
        return;


    if(jugadores.length === 0){

        info.textContent =
            "⚠️ No hay participantes disponibles";

        return;

    }


    info.textContent =
        "🎅 " +
        jugadores.length +
        " participantes en la ruleta";

}


/* =====================================================
   COLORES NAVIDEÑOS
===================================================== */

const colores = [

    "#e63946",

    "#ffd166",

    "#2a9d8f",

    "#90be6d",

    "#f4a261",

    "#e76f51",

    "#74c69d",

    "#ffcf56",

    "#ef476f",

    "#52b788",

    "#f77f00",

    "#c77dff"

];


/* =====================================================
   ELEMENTOS
===================================================== */

const scene =
    document.getElementById(
        "scene"
    );


let balls = [];

let animacion = null;

let girando = false;

let ganadorActual = null;

let ganadorJugador = null;

let tiempoConteo = null;


/* =====================================================
   CREAR PELOTITAS
===================================================== */

function crear(){

    /* =============================================
       LIMPIAR SOLAMENTE PELOTITAS
    ============================================= */

    balls.forEach(
        bola => {

            if(bola.parentNode){

                bola.parentNode.removeChild(
                    bola
                );

            }

        }
    );


    balls = [];


    /* =============================================
       SI NO HAY PARTICIPANTES
    ============================================= */

    if(
        jugadores.length === 0
    ){

        mostrarSinParticipantes();

        return;

    }


    let viejo =
        document.querySelector(
            ".sinParticipantes"
        );


    if(viejo){

        viejo.remove();

    }


    /* =============================================
       CREAR BOLAS
    ============================================= */

    jugadores.forEach(
        (j,i) => {

            let div =
                document.createElement(
                    "div"
                );


            div.className =
                "ball";


            div.innerHTML = `

                <div class="nombre">
                    ${escaparHTML(j.nombre)}
                </div>

                <div class="puntos">
                    ⭐ ${j.total} pts
                </div>

            `;


            div.dataset.nombre =
                j.nombre;


            div.dataset.puntos =
                j.total;


            let color =
                colores[
                    i %
                    colores.length
                ];


            div.style.background =

                `radial-gradient(
                    circle at 30% 25%,
                    #ffffff,
                    ${color}
                )`;


            /* =====================================
               POSICIÓN
            ===================================== */

            let ancho =
                window.innerWidth;


            let alto =
                window.innerHeight;


            let tamano =
                window.innerWidth <= 700
                    ? 85
                    : 120;


            div.x =
                Math.random() *
                Math.max(
                    20,
                    ancho - tamano
                );


            div.y =
                160 +
                Math.random() *
                Math.max(
                    20,
                    alto - 250
                );


            div.vx =
                Math.random() * 8 - 4;


            div.vy =
                Math.random() * 8 - 4;


            if(
                Math.abs(div.vx) < 2
            ){

                div.vx =
                    div.vx < 0
                        ? -2
                        : 2;

            }


            if(
                Math.abs(div.vy) < 2
            ){

                div.vy =
                    div.vy < 0
                        ? -2
                        : 2;

            }


            div.style.left =
                div.x + "px";


            div.style.top =
                div.y + "px";


            scene.appendChild(
                div
            );


            balls.push(
                div
            );

        }
    );

}


/* =====================================================
   MENSAJE SIN PARTICIPANTES
===================================================== */

function mostrarSinParticipantes(){

    let viejo =
        document.querySelector(
            ".sinParticipantes"
        );


    if(viejo)
        viejo.remove();


    let mensaje =
        document.createElement(
            "div"
        );


    mensaje.className =
        "sinParticipantes";


    mensaje.innerHTML = `

        <h2>
            🎄⚠️ NO HAY PARTICIPANTES
        </h2>

        <p>
            La ruleta toma los participantes
            desde el puesto <strong>#11</strong>
            en adelante.
            <br><br>
            Además deben tener
            <strong>20 puntos o más</strong>.
        </p>

    `;


    scene.appendChild(
        mensaje
    );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(texto){

    return String(texto)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   MOVIMIENTO
===================================================== */

function mover(){

    if(!girando)
        return;


    let tamano =
        window.innerWidth <= 700
            ? 85
            : 120;


    balls.forEach(
        bola => {

            bola.x +=
                bola.vx;


            bola.y +=
                bola.vy;


            let limiteX =
                window.innerWidth -
                tamano;


            let limiteY =
                window.innerHeight -
                tamano;


            if(
                bola.x <= 0 ||
                bola.x >= limiteX
            ){

                bola.vx *= -1;


                bola.x =
                    Math.max(
                        0,
                        Math.min(
                            bola.x,
                            limiteX
                        )
                    );

            }


            if(
                bola.y <= 145 ||
                bola.y >= limiteY
            ){

                bola.vy *= -1;


                bola.y =
                    Math.max(
                        145,
                        Math.min(
                            bola.y,
                            limiteY
                        )
                    );

            }


            bola.style.left =
                bola.x + "px";


            bola.style.top =
                bola.y + "px";

        }
    );


    animacion =
        requestAnimationFrame(
            mover
        );

}


/* =====================================================
   INICIAR RULETA
===================================================== */

function iniciar(){

    if(girando)
        return;


    if(
        balls.length === 0
    ){

        alert(
            "❌ No hay participantes disponibles."
        );

        return;

    }


    /* quitar ganador anterior */

    balls.forEach(
        bola => {

            bola.classList.remove(
                "win"
            );

            bola.style.opacity =
                "1";

        }
    );


    ganadorActual =
        null;


    ganadorJugador =
        null;


    document.getElementById(
        "ganador"
    ).innerHTML =
        "🎡 LA RULETA ESTÁ GIRANDO...";


    girando = true;


    mover();

}


/* =====================================================
   DETENER
===================================================== */

function detener(){

    if(!girando)
        return;


    girando = false;


    cancelAnimationFrame(
        animacion
    );


    if(
        balls.length === 0
    )
        return;


    /* =============================================
       ELEGIR GANADOR
    ============================================= */

    let index =
        Math.floor(
            Math.random() *
            balls.length
        );


    let ganador =
        balls[index];


    ganadorActual =
        ganador.dataset.nombre;


    let puntos =
        Number(
            ganador.dataset.puntos
        );


    ganadorJugador =
        jugadores.find(
            jugador =>
                jugador.nombre ===
                ganadorActual
        );


    /* =============================================
       OSCURECER LOS DEMÁS
    ============================================= */

    balls.forEach(
        bola => {

            bola.style.opacity =
                ".18";

        }
    );


    ganador.style.opacity =
        "1";


    ganador.classList.add(
        "win"
    );


    /* =============================================
       CENTRAR GANADOR
    ============================================= */

    let tamano =
        window.innerWidth <= 700
            ? 85
            : 120;


    ganador.style.left =
        (
            window.innerWidth / 2 -
            tamano / 2
        ) + "px";


    ganador.style.top =
        (
            window.innerHeight / 2 -
            tamano / 2
        ) + "px";


    /* =============================================
       TEXTO
    ============================================= */

    document.getElementById(
        "ganador"
    ).innerHTML =

        "🎉 GANADOR: " +
        ganadorActual +
        " • ⭐ " +
        puntos +
        " PTS";


    /* =============================================
       MODAL
    ============================================= */

    document.getElementById(
        "nombreGanador"
    ).textContent =
        ganadorActual;


    document.getElementById(
        "puntosGanador"
    ).textContent =
        "⭐ " +
        puntos +
        " puntos";


    document.getElementById(
        "mensajeConteo"
    ).innerHTML =
        "";


    document.getElementById(
        "numero"
    ).innerHTML =
        "";


    document.getElementById(
        "modal"
    ).style.display =
        "block";


    /* =============================================
       GUARDAR HISTORIAL
    ============================================= */

    historial.push({

        numero:
            historial.length + 1,

        nombre:
            ganadorActual,

        puntos:
            puntos,

        fecha:
            new Date().toLocaleString(
                "es-ES"
            )

    });


    localStorage.setItem(

        KEY_HISTORIAL,

        JSON.stringify(
            historial
        )

    );


    /* =============================================
       ELIMINAR GANADOR DE LA RULETA
       PERO NO DE JUGADORES
    ============================================= */

    jugadores =
        jugadores.filter(
            jugador =>
                jugador.nombre !==
                ganadorActual
        );


    localStorage.setItem(

        KEY_RULETA,

        JSON.stringify(
            jugadores
        )

    );

}


/* =====================================================
   CERRAR MODAL
===================================================== */

function cerrarModal(){

    document.getElementById(
        "modal"
    ).style.display =
        "none";


    clearInterval(
        tiempoConteo
    );


    ganadorActual =
        null;


    ganadorJugador =
        null;


    /* =============================================
       RECARGAR DESDE EL LOCALSTORAGE PRINCIPAL
       PARA MANTENER EL RANKING CORRECTO
    ============================================= */

    cargarDatos();


    crear();


    document.getElementById(
        "ganador"
    ).innerHTML =
        "";

}


/* =====================================================
   INICIAR CONTEO
===================================================== */

function iniciarConteo(){

    if(!ganadorActual){

        alert(
            "❌ Primero debe salir un ganador."
        );

        return;

    }


    clearInterval(
        tiempoConteo
    );


    document.getElementById(
        "mensajeConteo"
    ).innerHTML =

        "🎤 " +
        escaparHTML(
            ganadorActual
        ) +

        "<br><br>" +

        "POR FAVOR PRESENTE" +

        "<br>" +

        "ESPERE 5 SEGUNDOS";


    let espera = 5;


    document.getElementById(
        "numero"
    ).textContent =
        espera;


    tiempoConteo =
        setInterval(
            () => {

                espera--;


                document.getElementById(
                    "numero"
                ).textContent =
                    espera;


                if(
                    espera <= 0
                ){

                    clearInterval(
                        tiempoConteo
                    );


                    hacerCuenta();

                }

            },
            1000
        );

}


/* =====================================================
   CUENTA REGRESIVA
===================================================== */

function hacerCuenta(){

    let numero = 10;


    document.getElementById(
        "mensajeConteo"
    ).innerHTML =

        "🎤 " +
        escaparHTML(
            ganadorActual
        ) +

        "<br>" +

        "PREPÁRESE...";


    document.getElementById(
        "numero"
    ).textContent =
        numero;


    tiempoConteo =
        setInterval(
            () => {

                numero--;


                document.getElementById(
                    "numero"
                ).textContent =
                    numero;


                if(
                    numero <= 0
                ){

                    clearInterval(
                        tiempoConteo
                    );


                    document.getElementById(
                        "mensajeConteo"
                    ).innerHTML =

                        "🎤 " +
                        escaparHTML(
                            ganadorActual
                        ) +

                        "<br>" +

                        "¿ESTARÁ PRESENTE?";


                    document.getElementById(
                        "numero"
                    ).textContent =
                        "";

                }

            },
            1500
        );

}


/* =====================================================
   DETENER CONTEO
===================================================== */

function pararConteo(){

    clearInterval(
        tiempoConteo
    );


    if(!ganadorActual)
        return;


    document.getElementById(
        "mensajeConteo"
    ).innerHTML =

        "✅ PRESENTADO:" +

        "<br>" +

        escaparHTML(
            ganadorActual
        );


    document.getElementById(
        "numero"
    ).textContent =
        "";

}


/* =====================================================
   HISTORIAL
===================================================== */

function mostrarHistorial(){

    let caja =
        document.getElementById(
            "listaHistorial"
        );


    caja.innerHTML =
        "";


    if(
        historial.length === 0
    ){

        caja.innerHTML = `

            <div class="sinGanadores">

                🎄 Todavía no hay ganadores.

                <br><br>

                ¡La ruleta está esperando
                su primer ganador!

            </div>

        `;

    }
    else{

        historial.forEach(
            ganador => {

                let div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "itemHistorial";


                div.innerHTML = `

                    <div class="numeroGanador">

                        🏆 GANADOR
                        ${ganador.numero}

                        <br>

                        ⭐ ${ganador.puntos ?? 0} pts

                    </div>


                    <div class="nombreGanador">

                        ${escaparHTML(
                            ganador.nombre
                        )}

                        <br>

                        <small>

                            ${ganador.fecha}

                        </small>

                    </div>

                `;


                caja.appendChild(
                    div
                );

            }
        );

    }


    document.getElementById(
        "historialModal"
    ).style.display =
        "block";

}


/* =====================================================
   CERRAR HISTORIAL
===================================================== */

function cerrarHistorial(){

    document.getElementById(
        "historialModal"
    ).style.display =
        "none";

}


/* =====================================================
   ACTUALIZAR PARTICIPANTES
===================================================== */

function recargarParticipantes(){

    if(girando){

        alert(
            "🛑 Primero detén la ruleta."
        );

        return;

    }


    cargarDatos();

    crear();


    document.getElementById(
        "ganador"
    ).innerHTML =
        "";


    alert(

        "🎄✅ Participantes actualizados.\n\n" +

        "La ruleta usa:\n" +

        "• Puestos 11 en adelante\n" +

        "• Mínimo 20 puntos"

    );

}


/* =====================================================
   CAMBIO DE TAMAÑO
===================================================== */

window.addEventListener(
    "resize",
    () => {

        if(!girando){

            crear();

        }

    }
);


/* =====================================================
   INICIO
===================================================== */

cargarDatos();

crear();

</script>
